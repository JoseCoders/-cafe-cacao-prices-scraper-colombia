name: Scraper Precios Café y Cacao Colombia

on:
  schedule:
    - cron: '0 6,12,18,0 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar scraper
        run: node scraper/index.js

      - name: Guardar precios.json en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/precios.json
          git diff --staged --quiet || git commit -m "data: actualizar precios $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
